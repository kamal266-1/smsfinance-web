name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build web app
        run: bun run build:web

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          build-tools-version: 34.0.0
          platforms: android-34

      - name: Install Gradle 8.11.1
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.11.1/bin" >> $GITHUB_PATH

      - name: Create Android WebView wrapper
        run: |
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/java/com/kamal/smsfinance/web
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/xml
          
          # Copy web build to assets
          cp -r dist/* android/app/src/main/assets/
          
          # Create AndroidManifest.xml
          cat > android/app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.kamal.smsfinance.web">
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="SmsFinance"
                  android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">
                  <activity
                      android:exported="true"
                      android:name=".MainActivity">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          # Create MainActivity.kt
          cat > android/app/src/main/java/com/kamal/smsfinance/web/MainActivity.kt << 'EOF'
          package com.kamal.smsfinance.web
          
          import android.annotation.SuppressLint
          import android.os.Bundle
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.appcompat.app.AppCompatActivity
          
          class MainActivity : AppCompatActivity() {
              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val webView = WebView(this)
                  setContentView(webView)
          
                  webView.webViewClient = WebViewClient()
                  webView.settings.javaScriptEnabled = true
                  webView.settings.domStorageEnabled = true
                  webView.settings.allowFileAccess = true
                  webView.settings.allowContentAccess = true
          
                  webView.loadUrl("file:///android_asset/index.html")
              }
          }
          EOF
          
          # Create strings.xml
          cat > android/app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">SmsFinance</string>
          </resources>
          EOF
          
          # Create file_paths.xml
          cat > android/app/src/main/res/xml/file_paths.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <files-path name="files" path="." />
          </paths>
          EOF
          
          # Create app build.gradle.kts
          cat > android/app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          
          android {
              namespace = "com.kamal.smsfinance.web"
              compileSdk = 34
          
              defaultConfig {
                  applicationId = "com.kamal.smsfinance.web"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"
              }
          
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
                  debug {
                      isMinifyEnabled = false
                  }
              }
          
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          
              kotlinOptions {
                  jvmTarget = "17"
              }
          
              buildFeatures {
                  viewBinding = true
              }
          }
          
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
          }
          EOF
          
          # Create project build.gradle.kts with Google repository and stable AGP
          cat > android/build.gradle.kts << 'EOF'
          buildscript {
              repositories {
                  mavenCentral()
                  maven { url = uri("https://dl.google.com/dl/android/maven2/") }
              }
              dependencies {
                  classpath("com.android.tools.build:gradle:8.3.0")
                  classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24")
              }
          }
          
          allprojects {
              repositories {
                  mavenCentral()
                  maven { url = uri("https://dl.google.com/dl/android/maven2/") }
                  maven { url = uri("https://maven.google.com/") }
              }
          }
          
          tasks.register("clean", Delete::class) {
              delete(rootProject.buildDir)
          }
          EOF
          
          # Create settings.gradle.kts
          echo 'rootProject.name = "SmsFinanceWeb"' > android/settings.gradle.kts
          echo 'include(":app")' >> android/settings.gradle.kts
          
          echo "Android project created successfully"

      - name: Build Debug APK
        working-directory: android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: gradle assembleDebug --stacktrace --info

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmsFinanceWeb-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
